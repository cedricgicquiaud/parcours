name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # Jamais la base de l'utilisateur : une base jetable dans le runner.
          PARCOURS_DB_PATH: ${{ runner.temp }}/parcours.db
      - run: npm run build
